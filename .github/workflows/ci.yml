name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run benchmark:graph
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run check:public
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:vercel

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build and start local stack
        run: docker compose up --build --detach --wait
      - name: Verify proxied runtime and landing page
        run: |
          curl --fail --silent --show-error http://127.0.0.1:4310/health
          curl --fail --silent --show-error http://127.0.0.1:4310/ | grep --quiet '<div id="root"></div>'
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down local stack
        if: always()
        run: docker compose down --volumes
